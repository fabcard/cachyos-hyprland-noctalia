# Noctalia Greeter admin config. Installed to /var/lib/noctalia-greeter/greeter.toml.
# The cursor and the keyboard layout are filled in by the installer.

[cursor]
theme = "@CURSOR_THEME@"
size = 24
path = "@CURSOR_PATH@"

[keyboard]
layout = "@KB_LAYOUT@"
variant = "@KB_VARIANT@"

[session]
default = "Hyprland (uwsm-managed)"
